[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme>=25.1"]
build-backend = "hatchling.build"

[project]
name = "mcp-synology"
version = "0.11.0"
description = "MCP server for Synology NAS — manage files on your NAS via Claude"
dynamic = ["readme"]
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Chris Means" },
]
keywords = ["mcp", "synology", "nas", "file-station"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28",
    "pyyaml>=6.0.1",
    "keyring>=25.0",
    "pydantic>=2.14.2",
    "click>=8.2.1",
    "regex>=2026.9.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "types-regex>=2026.9.29",
    "respx>=0.22",
    # tests/test_readme.py builds the wheel metadata with the build backend (#487)
    "hatchling>=1.27",
    "hatch-fancy-pypi-readme>=25.1",
]
vdsm = [
    "testcontainers>=4.0",
    "playwright>=1.50",
]

[project.scripts]
mcp-synology = "mcp_synology.cli:main"

[project.urls]
Homepage = "https://github.com/cmeans/mcp-synology"
Repository = "https://github.com/cmeans/mcp-synology"
Issues = "https://github.com/cmeans/mcp-synology/issues"
Documentation = "https://github.com/cmeans/mcp-synology/tree/main/docs"

# PyPI shows the README as the project page, where a relative link resolves against
# pypi.org and breaks (#487). The build rewrites each one to the GitHub file at this
# release's tag, so the page links to the docs as they were when it was published.
# tests/test_readme.py builds the wheel's metadata and checks its long description.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/cmeans/mcp-synology/blob/v$HFPR_VERSION/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_synology"]
artifacts = [
    "src/mcp_synology/instructions/*.md",
    "src/mcp_synology/icons/*.svg",
    "src/mcp_synology/icons/*.png",
    "src/mcp_synology/icons/*.ico",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
# vdsm tooling requires the optional [vdsm] extras (playwright, testcontainers)
# which are not installed in the standard dev environment. Exclude both the
# script and the test helpers it imports so default `mypy src/ scripts/` runs
# clean. Run `uv sync --extra vdsm` and target these files explicitly to type
# check them.
exclude = [
    "scripts/vdsm_setup\\.py$",
    "tests/vdsm/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires a real Synology NAS (not run in CI)",
    "vdsm: requires virtual-dsm Docker container with KVM (not run in CI by default)",
]
addopts = "-m 'not integration and not vdsm' --cov=mcp_synology --cov-fail-under=95"

# CHANGELOG fragments (#731): each PR writes its entry as changelog.d/<PR>.<type>.md and the
# release PR assembles them into the version's notes with
# `uvx --from towncrier==26.9.0 towncrier build --version <version> --yes`. towncrier runs
# through uvx, so it isn't a project dependency. scripts/changelog_fragments.py checks the names
# and content (a misnamed file would otherwise be dropped from the notes) and that a PR adds one.
[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
template = "changelog.d/template.md"
title_format = "## {version} ({project_date})"
start_string = "<!-- towncrier release notes start -->\n"
issue_format = ""
wrap = false
all_bullets = false
orphan_prefix = "+"
# Not fragments: anything else in changelog.d makes `towncrier build` fail, not skip it.
ignore = ["README.md", "template.md"]

# A release's free text (a `**Security release:** …` line, an Upgrading block), written before
# the categories with no heading, as `+<name>.release.md`. Never required by `towncrier check`.
[[tool.towncrier.type]]
directory = "release"
name = "Release notes"
showcontent = true
check = false

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true
