name: PR Label Automation (CI)

# Handles label transitions when a PR's checks finish (pass or fail).
# Split from pr-labels.yml because workflow_run fires on every CI
# completion (including merges to main), which caused noisy failures
# when there was no associated PR.
#
# A PR is promoted to Ready for QA only when BOTH the CI and vdsm workflows
# have passed on its head commit, judged job by job (#241): vdsm's jobs (and
# CI's tool-quality report) are continue-on-error, so a run's own conclusion
# says "success" even when a job failed. tool-quality is report-only and is
# ignored; every other job must succeed (or be skipped).
#
# NOTE: References the workflows by name ("CI", "vdsm") and file (ci.yml,
# vdsm.yml). If either is renamed, update it here and in pr-labels.yml
# (on-unlabel), which uses the same check.
#
# LIMITATION: workflow_run triggers always run from the default branch
# (main), not the PR branch. Changes to this file cannot be tested
# on a PR — they take effect only after merge.
on:
  workflow_run:
    workflows: [CI, vdsm]
    types: [completed]

# No token permissions by default; each job asks only for what it uses (#203).
permissions: {}

jobs:
  # When CI or vdsm finishes on a PR: Ready for QA once both have passed on the
  # head commit, CI Failed as soon as either has a failed job, nothing while one
  # is still running (its own completion re-runs this). Skips if Dev Active is
  # present (dev isn't done yet; on-unlabel in pr-labels.yml takes over).
  on-checks-complete:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    # CI and vdsm can finish moments apart; evaluate one commit at a time.
    concurrency:
      group: pr-labels-ci-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Update CI labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          # Find the open PR whose head commit AND head repository match this run
          # (#203). Never by branch name: a fork chooses its branch name, so a fork
          # branch named after a maintainer branch used to relabel the maintainer's
          # PR. Covers same-repo, Dependabot and fork PRs alike; a run whose commit
          # is no longer any PR's head (force-pushed away) matches nothing. An API
          # or permissions error fails the job rather than passing as "no PR".
          PR=$(gh pr list --repo "$REPO" --state open --limit 100 \
            --json number,headRefOid,headRepositoryOwner,headRepository \
            --jq '[.[] | select(.headRefOid == env.HEAD_SHA and (.headRepositoryOwner.login + "/" + .headRepository.name) == env.HEAD_REPO) | .number] | first // empty')

          if [ -z "$PR" ]; then
            echo "No PR associated with this workflow run — exiting"
            exit 0
          fi

          # pass / fail / pending for the head commit across CI and vdsm, from the
          # latest run of each and its latest-attempt jobs. Keep in sync with
          # on-unlabel in pr-labels.yml.
          STATE=pass
          for WF in ci.yml vdsm.yml; do
            RUN=$(gh api "repos/$REPO/actions/workflows/$WF/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=1" \
              --jq '.workflow_runs[0] // empty | "\(.id) \(.status)"')
            if [ -z "$RUN" ]; then
              echo "$WF: no run yet for $HEAD_SHA"
              STATE=pending; continue
            fi
            read -r RUN_ID RUN_STATUS <<< "$RUN"
            if [ "$RUN_STATUS" != completed ]; then
              echo "$WF: run $RUN_ID is $RUN_STATUS"
              STATE=pending; continue
            fi
            BAD=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs" \
              --jq '.jobs[] | select(.name != "tool-quality" and .conclusion != "success" and .conclusion != "skipped") | "\(.name): \(.conclusion)"')
            if [ -n "$BAD" ]; then
              echo "$WF: run $RUN_ID has failed jobs:"; echo "$BAD"
              STATE=fail; break
            fi
            echo "$WF: run $RUN_ID passed"
          done
          echo "Checks on $HEAD_SHA: $STATE"

          LABELS=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name')
          has() { echo "$LABELS" | grep -qx "$1"; }

          # Dev Active means dev isn't done — don't relabel.
          if has "Dev Active"; then
            echo "Dev Active present — skipping"
            exit 0
          fi

          case "$STATE" in
            pass)
              # Awaiting CI (normal flow) or CI Failed (a failed job re-run green).
              REMOVE=""
              has "Awaiting CI" && REMOVE="Awaiting CI"
              has "CI Failed" && REMOVE="${REMOVE:+$REMOVE,}CI Failed"
              if [ -n "$REMOVE" ]; then
                gh pr edit "$PR" --repo "$REPO" --remove-label "$REMOVE"
                # Not while the branch has a merge conflict: resolving it changes
                # the diff (pr-behind-main.yml). The fix is a push, which restarts
                # Awaiting CI. Behind main alone doesn't hold QA up.
                if has "Merge conflict"; then
                  echo "Merge conflict present: checks passed, Ready for QA withheld"
                else
                  gh pr edit "$PR" --repo "$REPO" --add-label "Ready for QA"
                fi
              fi
              ;;
            fail)
              # Never leave Ready for QA on a commit with a failed job.
              REMOVE=""
              has "Awaiting CI" && REMOVE="Awaiting CI"
              has "Ready for QA" && REMOVE="${REMOVE:+$REMOVE,}Ready for QA"
              if [ -n "$REMOVE" ]; then
                gh pr edit "$PR" --repo "$REPO" --remove-label "$REMOVE"
                gh pr edit "$PR" --repo "$REPO" --add-label "CI Failed"
              fi
              ;;
            pending)
              echo "Waiting for the other workflow to finish"
              ;;
          esac
