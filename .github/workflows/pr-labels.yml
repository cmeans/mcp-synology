name: PR Label Automation

# Handles label transitions triggered by PR events (push, label, unlabel).
# Labeling on CI and vdsm completion lives in pr-labels-ci.yml (separate workflow_run trigger).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, labeled, unlabeled]

permissions:
  pull-requests: write
  actions: read  # on-unlabel reads CI and vdsm job results
  contents: read  # on-unlabel checks out the script that reads them

jobs:
  # When a PR is opened or new commits are pushed, reset to Awaiting CI.
  # Removes stale QA/workflow labels. Keeps Dev Active if present (coexists
  # with Awaiting CI — dev is still working, CI runs but won't promote).
  on-push:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    steps:
      - name: Reset labels on new push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}

          # Read now, not from the event: adding Dev Active just before a push removes Awaiting
          # CI in on-label while this runs, and the event's stale list then left the PR with no
          # label at all (#565).
          PR_LABELS=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '[.labels[].name]')

          HAD_QA_ACTIVE=false
          if echo "$PR_LABELS" | grep -q '"QA Active"'; then
            HAD_QA_ACTIVE=true
          fi

          # Remove stale workflow labels (coalesced into one API call)
          REMOVE=""
          for LABEL in "Ready for QA" "Ready for QA Signoff" "QA Approved" "QA Active" "QA Failed" "CI Failed"; do
            if echo "$PR_LABELS" | grep -q "\"$LABEL\""; then
              if [ -n "$REMOVE" ]; then
                REMOVE="$REMOVE,$LABEL"
              else
                REMOVE="$LABEL"
              fi
            fi
          done
          if [ -n "$REMOVE" ]; then
            gh pr edit "$PR" --repo "$REPO" --remove-label "$REMOVE"
          fi

          # Add Awaiting CI (unless already present).
          # Dev Active is NOT removed — it coexists with Awaiting CI.
          if ! echo "$PR_LABELS" | grep -q '"Awaiting CI"'; then
            gh pr edit "$PR" --repo "$REPO" --add-label "Awaiting CI"
          fi

          # If QA was actively reviewing, notify via comment
          if [ "$HAD_QA_ACTIVE" = true ]; then
            gh pr comment "$PR" --repo "$REPO" \
              --body "New commits pushed while QA was active. QA review invalidated — resetting to Awaiting CI."
          fi

  # When Dev Active is removed manually, check whether the head commit's CI and
  # vdsm runs already passed. If yes, promote straight to Ready for QA; if a job
  # failed, set CI Failed; if either is still running, Awaiting CI stays and
  # pr-labels-ci.yml promotes when they complete. (A completed run whose jobs
  # have no result recorded yet also leaves Awaiting CI; pr-labels-recheck.yml
  # checks it again.) Nothing changes if Dev Active was added back during the wait.
  on-unlabel:
    if: >-
      github.event.action == 'unlabeled'
      && github.event.label.name == 'Dev Active'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Transition after Dev Active removed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          STATE=$(bash .github/scripts/pr-checks-state.sh)

          # The state took up to 80 s to read: if a newer commit was
          # pushed meanwhile, its own runs decide the labels.
          CUR=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)
          if [ "$CUR" != "$HEAD_SHA" ]; then
            echo "PR #$PR moved to $CUR — leaving the labels to its runs"
            exit 0
          fi

          # The event's labels can be up to 80 s old by now, so read them again: if Dev
          # Active came back meanwhile, dev isn't done, and pr-labels-ci.yml or the next
          # removal decides.
          PR_LABELS=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '[.labels[].name]')
          has() { echo "$PR_LABELS" | grep -q "\"$1\""; }
          if has "Dev Active"; then
            echo "Dev Active is back — leaving the labels"
            exit 0
          fi
          case "$STATE" in
            pass)
              REMOVE=""
              has "Awaiting CI" && REMOVE="Awaiting CI"
              has "CI Failed" && REMOVE="${REMOVE:+$REMOVE,}CI Failed"
              if [ -n "$REMOVE" ]; then
                gh pr edit "$PR" --repo "$REPO" --remove-label "$REMOVE"
              fi
              # Not while the branch has a merge conflict (as pr-labels-settle.sh).
              if has "Merge conflict"; then
                echo "Merge conflict present: checks passed, Ready for QA withheld"
              else
                gh pr edit "$PR" --repo "$REPO" --add-label "Ready for QA"
              fi
              ;;
            fail)
              if has "Awaiting CI"; then
                gh pr edit "$PR" --repo "$REPO" --remove-label "Awaiting CI"
              fi
              gh pr edit "$PR" --repo "$REPO" --add-label "CI Failed"
              ;;
            pending)
              # Awaiting CI should already be present
              if ! has "Awaiting CI"; then
                gh pr edit "$PR" --repo "$REPO" --add-label "Awaiting CI"
              fi
              ;;
          esac

  # When a workflow label is added, clean up labels that no longer apply.
  # Only runs for labels that have cleanup rules.
  on-label:
    if: >-
      github.event.action == 'labeled'
      && contains(fromJSON('["Ready for QA","QA Active","Dev Active","Ready for QA Signoff","QA Failed","QA Approved"]'), github.event.label.name)
    runs-on: ubuntu-latest
    steps:
      - name: Clean up stale labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADDED_LABEL: ${{ github.event.label.name }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          PR=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}

          remove_if_present() {
            if echo "$PR_LABELS" | grep -q "\"$1\""; then
              gh pr edit "$PR" --repo "$REPO" --remove-label "$1"
            fi
          }

          case "$ADDED_LABEL" in
            "Ready for QA")
              remove_if_present "Awaiting CI"
              remove_if_present "CI Failed"
              ;;
            "QA Active")
              remove_if_present "Ready for QA"
              ;;
            "Dev Active")
              remove_if_present "QA Failed"
              remove_if_present "CI Failed"
              remove_if_present "Awaiting CI"
              remove_if_present "Ready for QA"
              ;;
            "Ready for QA Signoff")
              remove_if_present "QA Active"
              ;;
            "QA Failed")
              remove_if_present "QA Active"
              remove_if_present "Ready for QA Signoff"
              ;;
            "QA Approved")
              remove_if_present "Ready for QA Signoff"
              ;;
          esac
