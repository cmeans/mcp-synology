name: vdsm

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Explicit read-only default for every job (#206, CodeQL actions/missing-workflow-permissions),
# so a change to the repo's default token permissions can't widen it. Jobs that need
# more declare their own `permissions:`, which replaces this block for that job.
permissions:
  contents: read

# A new push to a PR cancels that PR's older, superseded run (#284). Pushes to main
# never cancel each other: each main run tests its commit, and vdsm's saves the
# golden-image cache. The label automation finds a run's PR by its head commit, and a
# superseded run's commit is no longer any PR's head, so a cancelled run sets no label.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pins JavaScript-action Node runtime to Node 24 across all JS-based
  # GitHub Actions in this workflow. Matches the pattern used by the
  # other workflows in .github/workflows/ so CI behavior is consistent
  # across runners during GitHub's staged Node runtime rollouts.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Default admin credentials used inside vdsm setup. NOT secrets — the
  # VM is ephemeral and exposed only to the test runner.
  VDSM_ADMIN_USER: mcpadmin
  VDSM_ADMIN_PASSWORD: "McpTest123!"

jobs:
  vdsm:
    name: vdsm integration tests (${{ matrix.dsm }})
    runs-on: ubuntu-24.04
    # Every DSM version the tests support. 7.1 is what real NASes such as the
    # maintainer's DS1618+ run, and its behavior differs from 7.2.2 (#195, #162);
    # 7.3.2 and 7.4.1 are the newest releases (#307).
    strategy:
      fail-fast: false
      matrix:
        dsm: ["7.2.2", "7.1", "7.3.2", "7.4.1"]
    env:
      DSM_VERSION: ${{ matrix.dsm }}
    # Non-blocking while the job stabilizes. Promote to required check
    # after the job is green on main for several consecutive runs.
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a PR the checkout is GitHub's merge commit, whose first parent is
          # main: depth 2 lets the next step diff the PR against it.
          fetch-depth: 2

      # A PR that changes no code (#284): only Markdown at the repository root
      # (README, CHANGELOG, CLAUDE.md, ...), docs/, issue templates or LICENSE. Not
      # Markdown elsewhere: src/mcp_synology/instructions/*.md are the server's
      # instructions. The job still runs and passes with every later step skipped, so the
      # checks keep their names (a job skipped by `if:` loses its matrix name, which
      # #25 would make required) and the label automation finds a passed run for the
      # commit. Pushes to main always run. --no-renames lists a moved file under both
      # paths, so moving code into docs/ still counts as a code change.
      - name: Does this change need vdsm?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          code=true
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --no-renames --name-only HEAD^1 HEAD)
            if [ -n "$files" ] \
                && ! grep -qvE '(^[^/]+\.md$|^docs/|^\.github/ISSUE_TEMPLATE/|^LICENSE$)' <<< "$files"; then
              code=false
              echo "::notice::No code changed (only root Markdown, docs/, issue templates or LICENSE): vdsm skipped"
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # The golden-image cache (#132). Its key is BAKE_VERSION, which is bumped on
      # every change to what the bake produces, so a change to the bake scripts
      # that leaves the image alone (#271) doesn't rebake everything. A PR that
      # changes the bake files bakes fresh instead of restoring, so its own run
      # tests the new bake (.github/labeler.yml labels such a PR "Rebuilds vdsm
      # image"; keep its file list in sync with the one below). Only main
      # saves: a PR's cache is readable by that PR alone, and PR copies (about
      # 1 GB per DSM version) filled the repo's 10 GB cache and pushed main's
      # out.
      - name: Golden image cache key
        id: golden
        if: steps.scope.outputs.code == 'true'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          bake=$(sed -n 's/^BAKE_VERSION: int = \([0-9][0-9]*\)$/\1/p' tests/vdsm/config.py)
          if [ -z "$bake" ]; then
            echo "::error::BAKE_VERSION not found in tests/vdsm/config.py"
            exit 1
          fi
          changed=false
          if [ "$EVENT" = pull_request ] && git diff --no-renames --name-only HEAD^1 HEAD | grep -qxE \
              'scripts/vdsm_setup\.py|tests/vdsm/(setup_dsm|config|golden_image|container)\.py'; then
            changed=true
            # The key only changes with BAKE_VERSION: without a bump, main keeps
            # restoring the old image after this merges.
            if ! git diff HEAD^1 HEAD -- tests/vdsm/config.py | grep -qE '^[-+]BAKE_VERSION'; then
              echo "::warning::bake files changed without a BAKE_VERSION bump; fine only if the image is unchanged (e.g. #271)"
            fi
          fi
          echo "key=vdsm-golden-${DSM_VERSION}-bake${bake}" >> "$GITHUB_OUTPUT"
          echo "bake_files_changed=$changed" >> "$GITHUB_OUTPUT"
          echo "key vdsm-golden-${DSM_VERSION}-bake${bake}; bake files changed: $changed"

      - name: Restore golden image cache
        id: cache-golden
        if: steps.scope.outputs.code == 'true' && steps.golden.outputs.bake_files_changed != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .vdsm/golden/dsm-${{ env.DSM_VERSION }}.tar.gz
            .vdsm/golden/dsm-${{ env.DSM_VERSION }}.meta.json
          key: ${{ steps.golden.outputs.key }}

      # Disk the job still needs when this step runs, after the cache restore (#525),
      # measured from bake v9's images, in GiB (df -BG and du count binary units): a
      # restored image is about 26.4 GiB (the 16 GiB data and 10 GiB system disk images;
      # tarfile writes them out in full, not sparse), the tarball about 1.2 GiB, the
      # virtual-dsm container image 0.5 GiB, and the venv 0.25 GiB (1 GiB allowed).
      # - Cache hit: the tarball is already on disk, so what's left is the extracted
      #   image, the container image and the venv: about 28 GiB. Threshold 31.
      # - Cache miss: the bake writes into the storage folder, then the tarball, then the
      #   restore clears the folder and extracts again, plus Playwright's Chromium: a
      #   peak of about 30 GiB. Threshold 35.
      #
      # Most runners have a 145 GiB root with about 85 GiB free, and skip the cleanup
      # below (it took 84-109 s when every job ran it, #132). Some come with a 72 GiB
      # disk and about 12 GiB free (an AWS-hosted ubuntu-24.04 runner on #477, #525).
      # TEST ONLY (#527's throwaway run, never merged): fill the disk until 12 GiB is
      # free, like the AWS runner on #477, to exercise the cleanup.
      - name: "TEST ONLY: fill the disk to 12 GiB free"
        if: steps.scope.outputs.code == 'true'
        run: |
          set -euo pipefail
          df -h /
          free=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          sudo fallocate -l "$((free - 12))G" /var/tmp/disk-fill
          df -h /

      - name: Check free disk space
        id: disk
        if: steps.scope.outputs.code == 'true'
        env:
          CACHE_HIT: ${{ steps.cache-golden.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "${CACHE_HIT}" = "true" ]; then need=31; else need=35; fi
          free=""
          if df -h /; then free=$(df --output=avail -BG / | tail -1 | tr -dc 0-9) || free=""; fi
          if [ -z "$free" ]; then
            echo "::error::couldn't read free disk space"
            exit 1
          fi
          echo "need=$need" >> "$GITHUB_OUTPUT"
          if [ "$free" -lt "$need" ]; then
            echo "::warning::only ${free} GiB free; this job needs ${need} GiB here"
            echo "short=true" >> "$GITHUB_OUTPUT"
          fi

      # Only on a runner short of space, and only a GitHub-hosted one (a self-hosted
      # runner keeps its tools): the action, not a hand-written rm -rf (maintainer's
      # call, #275). Android, .NET and Haskell freed about 20 GiB on #180's vdsm run
      # (measured in #181), which gets a 12 GiB runner past the cache-hit threshold, the
      # usual case on a PR; a cache miss on one still fails the re-check below. Not the
      # apt purge of large packages (slow; dropped on #275), not Docker images (the image
      # ships none) and not the preinstalled runtimes in the tool cache (Node, Go, Python,
      # Ruby, the CodeQL bundle): the job doesn't use them, but what removing them frees
      # isn't measured, and the three above are enough on a cache hit.
      - name: Free disk space (small runner only)
        if: steps.disk.outputs.short == 'true' && runner.environment == 'github-hosted'
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false
          preinstalled-runtimes: false

      - name: Check free disk space again
        if: steps.disk.outputs.short == 'true'
        env:
          NEED: ${{ steps.disk.outputs.need }}
          CLEANED: ${{ runner.environment == 'github-hosted' }}
        run: |
          set -euo pipefail
          : "${NEED:?missing the need output of the first disk check}"
          free=""
          if df -h /; then free=$(df --output=avail -BG / | tail -1 | tr -dc 0-9) || free=""; fi
          if [ -z "$free" ]; then
            echo "::error::couldn't read free disk space"
            exit 1
          fi
          if [ "$free" -lt "$NEED" ]; then
            if [ "$CLEANED" = "true" ]; then
              echo "::error::only ${free} GiB free after removing the Android SDK, .NET and Haskell; this job needs ${NEED} GiB here. The runner is too small: re-run the job, which usually gets one with about 85 GiB free"
            else
              echo "::error::only ${free} GiB free; this job needs ${NEED} GiB here. Free space on the runner, then re-run"
            fi
            exit 1
          fi

      - name: Verify /dev/kvm is available
        if: steps.scope.outputs.code == 'true'
        run: |
          ls -la /dev/kvm
          sudo chmod 666 /dev/kvm
          echo "KVM available"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.scope.outputs.code == 'true'
        with:
          python-version: "3.12"

      - name: Install project with vdsm extras
        if: steps.scope.outputs.code == 'true'
        run: uv sync --extra dev --extra vdsm

      # Only the bake drives a browser.
      - name: Install Playwright Chromium
        if: steps.scope.outputs.code == 'true' && steps.cache-golden.outputs.cache-hit != 'true'
        run: uv run playwright install --with-deps chromium

      - name: Build golden image (cache miss)
        if: steps.scope.outputs.code == 'true' && steps.cache-golden.outputs.cache-hit != 'true'
        run: |
          uv run python scripts/vdsm_setup.py \
            --version "${DSM_VERSION}" \
            --admin-user "${VDSM_ADMIN_USER}" \
            --admin-password "${VDSM_ADMIN_PASSWORD}" \
            --yes

      # Saved right after the bake, so PRs can restore it while main's tests
      # still run. A key that exists already (another run saved it first) only
      # warns.
      - name: Save golden image cache (main only)
        if: >-
          steps.scope.outputs.code == 'true'
          && github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.cache-golden.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .vdsm/golden/dsm-${{ env.DSM_VERSION }}.tar.gz
            .vdsm/golden/dsm-${{ env.DSM_VERSION }}.meta.json
          key: ${{ steps.golden.outputs.key }}

      - name: Run vdsm integration tests
        if: steps.scope.outputs.code == 'true'
        # Step budget below the job's, so a hung suite still leaves time to
        # print pytest's summary path and upload logs (#107 was cancelled
        # at the job timeout with neither).
        timeout-minutes: 30
        # tests/vdsm must be on the command line: --dsm-version is defined in
        # tests/vdsm/conftest.py, which pytest only loads early enough to register
        # options when the directory is given. It collects the same tests as
        # `pytest -m vdsm` from the root. --durations lists the 30 slowest setups, calls
        # and teardowns (1 s or more) at the end, to show where the job's time goes (#132).
        run: uv run pytest tests/vdsm -m vdsm -v --no-cov --log-cli-level=INFO --durations=30 --durations-min=1.0 --dsm-version "${DSM_VERSION}"

      - name: Upload logs on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vdsm-failure-logs-${{ matrix.dsm }}
          path: |
            .vdsm/storage/**/log/
            /tmp/vdsm-*.log
          if-no-files-found: ignore
          retention-days: 7
