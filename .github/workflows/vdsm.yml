name: vdsm

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Explicit read-only default for every job (#206, CodeQL actions/missing-workflow-permissions),
# so a change to the repo's default token permissions can't widen it. Jobs that need
# more declare their own `permissions:`, which replaces this block for that job.
permissions:
  contents: read

env:
  # Pins JavaScript-action Node runtime to Node 24 across all JS-based
  # GitHub Actions in this workflow. Matches the pattern used by the
  # other workflows in .github/workflows/ so CI behavior is consistent
  # across runners during GitHub's staged Node runtime rollouts.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Default admin credentials used inside vdsm setup. NOT secrets — the
  # VM is ephemeral and exposed only to the test runner.
  VDSM_ADMIN_USER: mcpadmin
  VDSM_ADMIN_PASSWORD: "McpTest123!"

jobs:
  vdsm:
    name: vdsm integration tests (${{ matrix.dsm }})
    runs-on: ubuntu-24.04
    # Both DSM versions the tests support: 7.1 is what real NASes such as the
    # maintainer's DS1618+ run, and its behavior differs from 7.2.2 (#195, #162).
    strategy:
      fail-fast: false
      matrix:
        dsm: ["7.2.2", "7.1"]
    env:
      DSM_VERSION: ${{ matrix.dsm }}
    # Non-blocking while the job stabilizes. Promote to required check
    # after the job is green on main for several consecutive runs.
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a PR the checkout is GitHub's merge commit, whose first parent is
          # main: depth 2 lets the next step diff the PR against it.
          fetch-depth: 2

      # The golden-image cache (#132). Its key is BAKE_VERSION, which is bumped on
      # every change to what the bake produces, so a change to the bake scripts
      # that leaves the image alone (#271) doesn't rebake everything. A PR that
      # changes the bake files bakes fresh instead of restoring, so its own run
      # tests the new bake. Only main saves: a PR's cache is readable by that PR
      # alone, and PR copies (about 1 GB per DSM version) filled the repo's 10 GB
      # cache and pushed main's out.
      - name: Golden image cache key
        id: golden
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          bake=$(sed -n 's/^BAKE_VERSION: int = \([0-9][0-9]*\)$/\1/p' tests/vdsm/config.py)
          if [ -z "$bake" ]; then
            echo "::error::BAKE_VERSION not found in tests/vdsm/config.py"
            exit 1
          fi
          changed=false
          if [ "$EVENT" = pull_request ] && git diff --name-only HEAD^1 HEAD | grep -qxE \
              'scripts/vdsm_setup\.py|tests/vdsm/(setup_dsm|config|golden_image|container)\.py'; then
            changed=true
          fi
          echo "key=vdsm-golden-${DSM_VERSION}-bake${bake}" >> "$GITHUB_OUTPUT"
          echo "bake_files_changed=$changed" >> "$GITHUB_OUTPUT"
          echo "key vdsm-golden-${DSM_VERSION}-bake${bake}; bake files changed: $changed"

      - name: Restore golden image cache
        id: cache-golden
        if: steps.golden.outputs.bake_files_changed != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .vdsm/golden/dsm-${{ env.DSM_VERSION }}.tar.gz
            .vdsm/golden/dsm-${{ env.DSM_VERSION }}.meta.json
          key: ${{ steps.golden.outputs.key }}

      # GitHub-hosted Ubuntu runners ship ~14 GB free of ~75 GB. The vdsm
      # workflow needs significantly more: a ~1.1 GB compressed golden image
      # tarball (bake v5, with Synology Photos) + ~27 GB extracted storage
      # (the 16 GB data and 11 GB system disk images; tarfile writes them out
      # in full, not sparse) + testcontainers spawning a vdsm
      # container with its own /storage bind-mount + Python venv + Playwright
      # Chromium download. CI on 550f445 hit
      # `System.IO.IOException: No space left on device` after the bake
      # succeeded but during the test step. Removing preinstalled software we
      # don't use with rm takes seconds; jlumbroso/free-disk-space's apt purge
      # of large packages took about 2 minutes (#132, #181). Docker images stay:
      # testcontainers would pull them again. /opt/hostedtoolcache stays apart
      # from CodeQL: uv's Python comes from it.
      - name: Free disk space
        run: |
          set -euo pipefail
          df -h /
          sudo swapoff -a && sudo rm -f /mnt/swapfile /swapfile
          for d in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
              /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
              /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft \
              /opt/google /opt/az /usr/lib/jvm /usr/lib/google-cloud-sdk \
              /usr/local/julia*; do
            sudo rm -rf "$d" &
          done
          wait
          df -h /
          free_gb=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          # Extracted image + tarball + bake, with room to spare.
          if [ "$free_gb" -lt 35 ]; then
            echo "::error::only ${free_gb} GB free after cleanup; the vdsm job needs about 35 GB"
            exit 1
          fi

      - name: Verify /dev/kvm is available
        run: |
          ls -la /dev/kvm
          sudo chmod 666 /dev/kvm
          echo "KVM available"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Install project with vdsm extras
        run: uv sync --extra dev --extra vdsm

      # Only the bake drives a browser.
      - name: Install Playwright Chromium
        if: steps.cache-golden.outputs.cache-hit != 'true'
        run: uv run playwright install --with-deps chromium

      - name: Build golden image (cache miss)
        if: steps.cache-golden.outputs.cache-hit != 'true'
        run: |
          uv run python scripts/vdsm_setup.py \
            --version "${DSM_VERSION}" \
            --admin-user "${VDSM_ADMIN_USER}" \
            --admin-password "${VDSM_ADMIN_PASSWORD}" \
            --yes

      # Saved right after the bake, so PRs can restore it while main's tests
      # still run. A key that exists already (another run saved it first) only
      # warns.
      - name: Save golden image cache (main only)
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.cache-golden.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .vdsm/golden/dsm-${{ env.DSM_VERSION }}.tar.gz
            .vdsm/golden/dsm-${{ env.DSM_VERSION }}.meta.json
          key: ${{ steps.golden.outputs.key }}

      - name: Run vdsm integration tests
        # Step budget below the job's, so a hung suite still leaves time to
        # print pytest's summary path and upload logs (#107 was cancelled
        # at the job timeout with neither).
        timeout-minutes: 30
        # tests/vdsm must be on the command line: --dsm-version is defined in
        # tests/vdsm/conftest.py, which pytest only loads early enough to register
        # options when the directory is given. It collects the same 108 tests as
        # `pytest -m vdsm` from the root.
        run: uv run pytest tests/vdsm -m vdsm -v --no-cov --log-cli-level=INFO --dsm-version "${DSM_VERSION}"

      - name: Upload logs on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vdsm-failure-logs-${{ matrix.dsm }}
          path: |
            .vdsm/storage/**/log/
            /tmp/vdsm-*.log
          if-no-files-found: ignore
          retention-days: 7
