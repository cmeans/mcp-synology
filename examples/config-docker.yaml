# Docker deployment — connection details from environment variables.
# Set: SYNOLOGY_HOST, SYNOLOGY_HTTPS=true (without it the password crosses the network in
# cleartext), SYNOLOGY_USERNAME, SYNOLOGY_PASSWORD; as needed, SYNOLOGY_PORT,
# SYNOLOGY_DEVICE_ID (2FA), SYNOLOGY_INSTANCE_ID and SYNOLOGY_LOG_LEVEL. This file sets the
# modules: without a config file, only File Station's read tools run.
schema_version: 1

# DSM's default certificate is self-signed, so with HTTPS either install one the container
# trusts (docs/https.md) or turn verification off here (the server warns that it's off):
# connection:
#   verify_ssl: false

modules:
  filestation:
    enabled: true
    permission: write
