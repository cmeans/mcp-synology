# Docker deployment — connection details from environment variables.
# Set: SYNOLOGY_HOST, SYNOLOGY_USERNAME, SYNOLOGY_PASSWORD; as needed, SYNOLOGY_HTTPS
# (true/false), SYNOLOGY_PORT, SYNOLOGY_DEVICE_ID (2FA), SYNOLOGY_INSTANCE_ID and
# SYNOLOGY_LOG_LEVEL. This file sets the modules: without a config file, only File
# Station's read tools run.
schema_version: 1

modules:
  filestation:
    enabled: true
    permission: write
