# Power user config — HTTPS, custom settings, logging.
schema_version: 1
instance_id: nas-primary
alias: HomeNAS
# Update notices to the model: all (default), security (security releases only) or off.
# The update check still runs and logs a newer version either way.
# update_notices: security

# Custom instructions prepended to the built-in server prompt.
# Useful for guiding Claude on when to use this connection vs others.
# Supports template variables: {display_name}, {instance_id}, {host}, {port},
# {home_dir}, {platform}
# custom_instructions: |
#   This is the primary NAS for media and backups.
#   Use this connection for all file operations unless the user
#   specifies a different NAS by name.

# Full replacement for the built-in server instructions.
# Start from the built-in files in src/mcp_synology/instructions/ (server.md;
# filestation.md and filestation-write.md if you use File Station; local.md if you use a
# tool that reads or writes local files), customize them in one file, and point to your
# version. Same template variables are supported.
# instructions_file: ~/.config/mcp-synology/my-instructions.md

connection:
  host: nas.local
  port: 5001
  https: true
  verify_ssl: false  # Self-signed cert

# Local folders every module's local-path tools may use; a module's own list adds to it.
# allowed_local_paths:  # every module
#   - ~/Downloads

modules:
  system:
    enabled: true  # CPU, memory, temperature, uptime (resource usage requires admin)
  filestation:
    enabled: true
    permission: write
    settings:
      file_type_indicator: text
      async_timeout: 180      # search_files and get_dir_size time limit (default 120)
      search_poll_interval: 2.0  # seconds between checks on a running search (default 1.0)
      # delete/copy/move/restore: how long a call waits before handing a still-running
      # task off to the NAS (default 30, capped at 600). The reply gives a handle for
      # file_task, which checks on the task or stops it.
      delete_timeout: 120
      copy_move_timeout: 300
      upload_timeout: 600
      download_timeout: 600
      default_download_dir: ~/Downloads
      allowed_local_paths:  # adds to a top-level list; without one, replaces the Downloads default
        - ~/Downloads
        - ~/Media
      default_upload_dir: /home/uploads
  photos:
    enabled: true  # needs the Synology Photos package on the NAS
    permission: write
    settings:
      allowed_local_paths:  # folders upload_photos reads from and download_photos writes to
        - ~/Downloads
        - ~/Pictures
      task_timeout: 60      # seconds a copy, move or delete waits before handing off
  downloadstation:
    enabled: true  # needs the Download Station package on the NAS
    permission: write
    settings:
      allowed_local_paths:  # folders create_download may read .torrent/.nzb files from;
        - ~/Downloads       # adds to a top-level list; without one, replaces the Downloads
        - ~/Torrents        # default, so ~/Downloads is listed to keep it
  storage:
    enabled: true  # read-only (no write tools yet); needs a DSM administrator account

logging:
  level: debug
  file: ~/.local/state/mcp-synology/nas-primary/server.log
