# Power user config — HTTPS, custom settings, logging.
schema_version: 1
instance_id: nas-primary
alias: HomeNAS
# check_for_updates: false  # Uncomment to disable update notices in Claude Desktop

# Custom instructions prepended to the built-in server prompt.
# Useful for guiding Claude on when to use this connection vs others.
# Supports template variables: {display_name}, {instance_id}, {host}, {port}
# custom_instructions: |
#   This is the primary NAS for media and backups.
#   Use this connection for all file operations unless the user
#   specifies a different NAS by name.

# Full replacement for the built-in server instructions.
# Copy the built-in server.md as a starting point, customize it,
# and point to your version. Same template variables are supported.
# instructions_file: ~/.config/mcp-synology/my-instructions.md

connection:
  host: nas.local
  port: 5001
  https: true
  verify_ssl: false  # Self-signed cert

# Local folders every module's local-path tools may use; a module's own list adds to it.
# allowed_local_paths:  # every module
#   - ~/Downloads

modules:
  filestation:
    enabled: true
    permission: write
    settings:
      file_type_indicator: text
      async_timeout: 180      # search_files and get_dir_size time limit (default 120)
      # delete/copy/move/restore: how long a call waits before handing a still-running
      # task off to the NAS (default 30, capped at 600). The reply gives a handle for
      # file_task, which checks on the task or stops it.
      delete_timeout: 120
      copy_move_timeout: 300
      upload_timeout: 600
      download_timeout: 600
      default_download_dir: ~/Downloads
      allowed_local_paths:  # added to the top-level list (default: Downloads)
        - ~/Downloads
        - ~/Media
      default_upload_dir: /home/uploads
  system:
    enabled: true  # CPU, memory, temperature, uptime (resource usage requires admin)
  downloadstation:
    enabled: true  # needs the Download Station package on the NAS
    permission: write
    settings:
      allowed_local_paths:  # folders create_download may read .torrent/.nzb files from,
        - ~/Torrents        # added to the top-level list (default: Downloads)

logging:
  level: debug
  file: ~/.local/state/mcp-synology/nas-primary/server.log
